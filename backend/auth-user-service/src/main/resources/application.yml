server:
  port: 8081

spring:
  application:
    name: auth-user-service
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db
    username: root
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: your-secret-key
  expiration: 86400000 # 24 hours
